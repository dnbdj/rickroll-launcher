name: Build and verify release zips

# The mac zip once shipped with no unix permissions at all, which made the whole
# download useless. Every build now runs through the builder's own checks, so a
# bad artifact fails here instead of on someone's Mac.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Only a tag carries a version. On a branch push the build keeps the
      # version in the source, because GITHUB_REF_NAME is just "main".
      - name: Work out the version from the tag
        id: v
        run: |
          version=""
          case "$GITHUB_REF" in
            refs/tags/v*) version="${GITHUB_REF_NAME#v}"; version="${version%%-*}" ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "version from tag: '${version:-none, keeping the source version}'"

      - name: Build both zips
        run: |
          args=(. dist)
          if [ -n "${{ steps.v.outputs.version }}" ]; then
            args+=(--version "${{ steps.v.outputs.version }}" --label "${{ steps.v.outputs.version }}")
          fi
          python tools/build-release.py "${args[@]}"

      - name: Install a headless Tk for the Mac smoke test
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-tk xvfb

      - name: Start the packaged Mac app under a virtual display
        run: |
          unzip -q dist/rickroll-launcher-macos-*.zip -d /tmp/mac
          /usr/bin/python3 -c "import tkinter; print('tkinter', tkinter.TkVersion)"
          xvfb-run -a /usr/bin/python3 "/tmp/mac/Rickroll Launcher.app/Contents/Resources/rickroll_mac_gui.py" --selftest

      - uses: actions/upload-artifact@v4
        with:
          name: release-zips
          path: dist/*.zip

      - name: Attach the zips to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --prerelease --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/*.zip --clobber
          gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[] | "\(.name) \(.size) bytes"'

  windows-syntax:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Every PowerShell file parses
        shell: pwsh
        run: |
          $failed = $false
          foreach ($file in @(Get-ChildItem -File *.ps1) + @(Get-ChildItem -File *.psm1)) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              Write-Host "FAIL $($file.Name): $($errors[0].Message)"
              $failed = $true
            } else {
              Write-Host "ok   $($file.Name)"
            }
          }
          if ($failed) { exit 1 }
